<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal Giriş</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #typewriter {
      border-right: 2px solid #fff;
      white-space: nowrap;
      overflow: hidden;
      animation: blink-caret 0.75s step-end infinite;
    }

    @keyframes blink-caret {
      50% { border-color: transparent; }
    }
  </style>
</head>
<body>
  <div id="typewriter"></div>

  <script>
    const text = "Sisteme giriş yapılıyor...\nHoş geldin, Komutan.";
    const typewriter = document.getElementById("typewriter");
    let index = 0;

    function type() {
      if (index < text.length) {
        typewriter.textContent += text[index] === '\n' ? '\n' : text[index];
        index++;
        setTimeout(type, 100); // Hız: 100ms harf başına
      }
    }

    type();
  </script>
</body>
</html>
